<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ReedPipe — HTTP Traffic Inspector</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 2rem;
      color: #1a1a1a;
    }
    #reedpipe-status {
      font-size: 0.9rem;
      color: #555;
      margin-bottom: 1rem;
    }
    table#reedpipe-session-table {
      border-collapse: collapse;
      width: 100%;
      font-size: 0.85rem;
    }
    #reedpipe-session-table th,
    #reedpipe-session-table td {
      border: 1px solid #ddd;
      padding: 0.4rem 0.6rem;
      text-align: left;
    }
    #reedpipe-session-table th {
      background: #f5f5f5;
    }
    #reedpipe-session-table td:nth-child(2) {
      font-family: ui-monospace, monospace;
      word-break: break-all;
    }
  </style>
</head>
