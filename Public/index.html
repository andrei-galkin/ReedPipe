<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ReedPipe — HTTP Traffic Inspector</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 2rem;
      color: #1a1a1a;
    }
    .reedpipe-page-header h1 {
      margin: 0;
      font-size: 1.6rem;
    }
    .reedpipe-page-description {
      margin: 0.35rem 0 0.75rem;
      color: #555;
      font-size: 0.95rem;
    }
    #reedpipe-status {
      font-size: 0.9rem;
      color: #555;
      margin-bottom: 1rem;
    }
    table#reedpipe-session-table {
      border-collapse: collapse;
      width: 100%;
      font-size: 0.85rem;
    }
    #reedpipe-session-table th,
    #reedpipe-session-table td {
      border: 1px solid #ddd;
      padding: 0.4rem 0.6rem;
      text-align: left;
    }
    #reedpipe-session-table th {
      background: #f5f5f5;
    }
    #reedpipe-session-table td:nth-child(2) {
      font-family: ui-monospace, monospace;
      word-break: break-all;
    }
    .reedpipe-view-response,
    .reedpipe-response-actions button {
      border: 1px solid #b8b8b8;
      border-radius: 0.3rem;
      background: #fff;
      padding: 0.3rem 0.75rem;
      cursor: pointer;
    }
    .reedpipe-view-response:hover,
    .reedpipe-response-actions button:hover {
      background: #f0f0f0;
    }
    .reedpipe-response-dialog {
      width: min(56rem, calc(100vw - 4rem));
      max-height: calc(100vh - 4rem);
      border: 0;
      border-radius: 0.5rem;
      box-shadow: 0 1rem 3rem rgb(0 0 0 / 25%);
      padding: 1.25rem;
    }
    .reedpipe-response-dialog::backdrop {
      background: rgb(0 0 0 / 45%);
    }
    .reedpipe-response-dialog h2 {
      margin: 0 0 0.75rem;
      font-size: 1.1rem;
    }
    .reedpipe-response-encoding-note {
      color: #795500;
      font-size: 0.85rem;
    }
    .reedpipe-response-content {
      max-height: calc(100vh - 13rem);
      overflow: auto;
      border: 1px solid #ddd;
      background: #f7f7f7;
      padding: 0.75rem;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .reedpipe-response-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <header class="reedpipe-page-header">
    <h1>ReedPipe Traffic Monitor</h1>
    <p class="reedpipe-page-description">Live HTTP and HTTPS requests captured by the local ReedPipe proxy.</p>
  </header>

  <div id="reedpipe-status"></div>

  <table id="reedpipe-session-table">
    <thead>
      <tr>
        <th>Method</th>
        <th>URL</th>
        <th>Status</th>
        <th>Duration (ms)</th>
        <th>Response</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <!-- Build with: swift package --scratch-path .build/wasm --swift-sdk <sdk-id> js --use-cdn --product Frontend -->
  <!-- (run from the ReedPipe project root; adjust the SDK id if yours differs) -->
  <script type="module">
    import { init } from "../.build/wasm/plugins/PackageToJS/outputs/Package/index.js";
    init();
  </script>
</body>
</html>
